[package]
name = "armatra"
version = "1.2.1"
edition = "2024"
rust-version = "1.99"
description = "A native skeletal-animation workstation with retargeting and a local motion library"
license = "MIT"
repository = "https://github.com/Speed126/Armatra"
readme = "README.md"

[dependencies]
anyhow = "=1.0.100"
blake3 = "=1.8.7"
bytemuck = { version = "=1.25.2", features = ["derive"] }
egui = { version = "=0.37.0", features = ["default_fonts"] }
egui-wgpu = "=0.37.0"
egui-winit = "=0.37.0"
glam = { version = "=0.34.1", features = ["bytemuck"] }
gltf = { version = "=1.4.1", default-features = false, features = ["names", "utils", "KHR_materials_pbrSpecularGlossiness"] }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
pollster = "=0.4.0"
percent-encoding = "=2.3.2"
rayon = "=1.12.0"
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
wgpu = "=30.0.1"
winit = "=0.30.13"

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "armatra"
path = "src/main.rs"
